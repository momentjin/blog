spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/bank?useSSL=false&allowPublicKeyRetrieval=true
    username: bank
    password: bank
    hikari:
      maximum-pool-size: 30
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
server:
  port: 8080
  tomcat:
    threads:
      max: 250
    accept-count: 1000
    max-connections: 2000
