services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank
    command: ["--transaction-isolation=REPEATABLE-READ"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7.4.7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
  app1:
    build: .
    image: bank-locks:local
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports: ["8081:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  app2:
    image: bank-locks:local
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports: ["8082:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
