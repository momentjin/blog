<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#526176" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica, Arial, Apple SD Gothic Neo, sans-serif"><text x="32" y="51.0" font-size="26" fill="#243247">같은 거래 원장에 서로 다른 요금 정책을 적용한다</text><text x="40" y="191.0" font-size="21" fill="#243247">거래 원장 (이벤트)</text><rect x="40" y="220" width="315" height="240" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="40" y="220" width="315" height="60" fill="#eaf0f7" stroke="none" stroke-width="1"/><rect x="40" y="340" width="315" height="60" fill="#f7f9fc" stroke="none" stroke-width="1"/><path d="M40,220 L355,220" fill="none" stroke="#8fa1b6" stroke-width="1.5"/><path d="M40,460 L355,460" fill="none" stroke="#8fa1b6" stroke-width="1.5"/><path d="M40,220 L40,460" fill="none" stroke="#8fa1b6" stroke-width="1.5"/><path d="M355,220 L355,460" fill="none" stroke="#8fa1b6" stroke-width="1.5"/><path d="M40,280 L355,280" fill="none" stroke="#8fa1b6" stroke-width="1.5"/><path d="M40,340 L355,340" fill="none" stroke="#d1d9e3" stroke-width="1"/><path d="M40,400 L355,400" fill="none" stroke="#d1d9e3" stroke-width="1"/><path d="M175,220 L175,460" fill="none" stroke="#d1d9e3" stroke-width="1"/><text x="58" y="255.85" font-size="18" fill="#243247">순서</text><text x="193" y="255.85" font-size="18" fill="#243247">이용 사실</text><text x="58" y="315.85" font-size="18" fill="#243247">1</text><text x="193" y="315.85" font-size="18" fill="#243247">8시간 기록</text><text x="58" y="375.85" font-size="18" fill="#243247">2</text><text x="193" y="375.85" font-size="18" fill="#243247">5시간으로 정정</text><text x="58" y="435.85" font-size="18" fill="#243247">3</text><text x="193" y="435.85" font-size="18" fill="#243247">6시간으로 정정</text><path d="M 355 330 L 405 330" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="275" width="215" height="110" rx="8" fill="#edf4ff" stroke="#243247" stroke-width="2"/><text x="423" y="308.0" font-size="18" fill="#243247">Replay</text><text x="423" y="332.3" font-size="18" fill="#243247">유효 이용 시간 6시간</text><rect x="740" y="100" width="340" height="100" rx="8" fill="#fff3db" stroke="#243247" stroke-width="2"/><text x="758" y="135.0" font-size="20" fill="#243247">기존 정책 v1</text><text x="758" y="162.0" font-size="20" fill="#243247">시간당 요금 10,000원/시간</text><rect x="740" y="245" width="340" height="110" rx="8" fill="#e8f5ec" stroke="#243247" stroke-width="2"/><text x="758" y="280.0" font-size="20" fill="#243247">v1 기준 이용료</text><text x="758" y="307.0" font-size="20" fill="#243247">6시간 × 10,000원/시간</text><text x="758" y="334.0" font-size="20" fill="#243247">60,000원</text><path d="M 910 200 L 910 245" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620,330 L680,330 L680,300 L740,300" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="740" y="475" width="340" height="110" rx="8" fill="#e8f5ec" stroke="#243247" stroke-width="2"/><text x="758" y="510.0" font-size="20" fill="#243247">v2 소급 적용 이용료</text><text x="758" y="537.0" font-size="20" fill="#243247">6시간 × 8,000원/시간</text><text x="758" y="564.0" font-size="20" fill="#243247">48,000원</text><rect x="740" y="620" width="340" height="90" rx="8" fill="#fff3db" stroke="#243247" stroke-width="2"/><text x="758" y="655.0" font-size="20" fill="#243247">소급 정책 v2</text><text x="758" y="682.0" font-size="20" fill="#243247">시간당 요금 8,000원/시간</text><path d="M 910 620 L 910 585" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620,355 L660,355 L660,530 L740,530" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>